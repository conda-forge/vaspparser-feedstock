schema_version: 1

context:
  name: vaspparser
  version: "0.0.9"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 87d837f339117c9a60d38be1841ee9ba601f2e8186f05e8ecd6653e5670a4d53

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - ase
    - defusedxml
    - numpy
    - pandas
    - scipy
  run:
    - python >=${{ python_min }}
    - ase >=3.23.0,<=3.29.0
    - defusedxml >=0.7.0,<=0.7.1
    - numpy >=1.26.0,<=2.5.1
    - pandas >=2.0.3,<=3.0.5
    - scipy >=1.11.1,<=1.18.0

tests:
  - python:
      imports:
        - vaspparser
      python_version: 
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Parser for the Vienna Ab initio Simulation Package (VASP)
  homepage: https://github.com/pyiron/vaspparser

extra:
  recipe-maintainers:
    - jan-janssen
