schema_version: 1

context:
  name: vaspparser
  version: 0.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2d2e83aae05627f11a334d89c1cda87a28b5e95b39fdbcda51b36ee4adf90b6a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - ase
    - defusedxml
    - numpy
    - pandas
    - scipy
  run:
    - python >=${{ python_min }}
    - ase >=3.23.0,<3.30.0
    - defusedxml >=0.7.0,<0.8.0
    - numpy >=1.26.0,<2.6.0
    - pandas >=2.0.3,<3.1.0
    - scipy >=1.11.1,<1.19.0
tests:
  - python:
      imports:
        - vaspparser
      python_version:
        - ${{ python_min }}
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Parser for the Vienna Ab initio Simulation Package (VASP)
  homepage: https://github.com/pyiron/vaspparser

extra:
  recipe-maintainers:
    - jan-janssen
